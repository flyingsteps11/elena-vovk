# Rebuilds the generated parts of the site (data/*.json from content/, header and footer in every
# page, works/<id>.html, news/<id>.html, sitemap.xml) and commits them to the repository.
# The live site is built on every push (pages.yml for GitHub Pages, netlify.toml for Netlify), so this runs only by hand
# (Actions → Build site → Run workflow), to bring the generated files in the repository up to date.
name: Build site

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs
      - name: Commit generated files
        run: |
          git add -A works news games tests sitemap.xml data *.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Сборка: данные, страницы работ и новостей, карта сайта"
          git push
