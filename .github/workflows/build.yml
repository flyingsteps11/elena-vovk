# Rebuilds the generated parts of the site (header and footer in every page, works/<id>.html,
# sitemap.xml) whenever the data or the partials change, for example after saving in /admin/.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "partials/**"
      - "tools/**"
      - "*.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs
      - name: Commit generated files
        run: |
          git add -A works sitemap.xml *.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Сборка: страницы работ и карта сайта"
          git push
