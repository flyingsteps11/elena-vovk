# Editor for the site: Decap CMS on Netlify (https://elena-vovk.netlify.app/admin/). Editors sign in with e-mail
# and password (Netlify Identity, invite only); their saves go to GitHub through Netlify Git Gateway.
# Every entry is its own file in content/; on every save GitHub Actions runs tools/build.mjs and publishes the site
# to GitHub Pages (.github/workflows/pages.yml), Netlify builds its own copy the same way (netlify.toml).

locale: ru
site_url: https://flyingsteps11.github.io/elena-vovk/
display_url: https://flyingsteps11.github.io/elena-vovk/
logo_url: /admin/logo.svg

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "{{collection}}: добавлено «{{slug}}»"
    update: "{{collection}}: изменено «{{slug}}»"
    delete: "{{collection}}: удалено «{{slug}}»"
    uploadMedia: "Загружен файл {{path}}"
    deleteMedia: "Удалён файл {{path}}"

media_folder: uploads/works
public_folder: /uploads/works

collections:
  - name: works
    label: Работы
    label_singular: работу
    description: Методические разработки, статьи и другие работы для каталога.
    folder: content/works
    format: json
    create: true
    slug: "{{fields.id}}"
    identifier_field: title
    summary: "{{title}} · {{year}}"
    preview_path: "works/{{fields.id}}.html"
    sortable_fields: [year, title, type]
    view_filters:
      - { label: Скрытые с сайта, field: published, pattern: false }
      - { label: Методические разработки, field: type, pattern: 'Методическая разработка' }
      - { label: Конспекты уроков, field: type, pattern: 'Конспект урока' }
      - { label: Статьи, field: type, pattern: 'Статья' }
    view_groups:
      - { label: По годам, field: year }
      - { label: По виду, field: type }
    fields:
      - { name: title, label: Название, widget: string }
      - name: type
        label: Вид работы
        widget: select
        options: [Методическая разработка, Конспект урока, Статья, Презентация, Сертификат, Работа студентов, Другое]
      - &year { name: year, label: Год, widget: number, value_type: int, min: 1990, max: 2100 }
      - { name: discipline, label: Код дисциплины, hint: "Например, МДК 02.02. Можно оставить пустым.", widget: string, required: false }
      - { name: description, label: Описание, hint: "Два-три предложения о том, что внутри и для кого работа.", widget: text, required: false }
      - { name: cover, label: Обложка, hint: "Фото или скан первой страницы, лучше JPG или WebP до 1 МБ. Без обложки карточка показывает вид работы и год.", widget: image, required: false }
      - { name: credit, label: Источник обложки, hint: "Заполните, если картинка чужая (автор, лицензия). Свою фотографию можно не подписывать.", widget: string, required: false }
      - { name: file, label: Файл работы, hint: "PDF, DOCX или PPTX, до 20 МБ.", widget: file, required: false }
      - { name: link, label: Внешняя ссылка, hint: "Если работа опубликована на другом сайте.", widget: string, required: false }
      - name: id
        label: Адрес страницы
        hint: Латиницей через дефис, например otkrytyj-urok-nds. Из него получится адрес works/otkrytyj-urok-nds.html. После публикации лучше не менять.
        widget: string
        pattern: ['^[a-z0-9-]+$', 'Только строчные латинские буквы, цифры и дефис']
      - &published { name: published, label: Показывать на сайте, widget: boolean, default: true }

  - name: disciplines
    label: Дисциплины
    label_singular: дисциплину
    description: Папки на странице «Материалы к занятиям».
    folder: content/disciplines
    format: json
    create: true
    slug: "{{fields.id}}"
    identifier_field: name
    summary: "{{name}} · {{code}}"
    media_folder: /uploads/materials
    public_folder: /uploads/materials
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Название дисциплины, widget: string }
      - { name: code, label: Код МДК, widget: string }
      - { name: specialty, label: Специальность, widget: string, required: false }
      - { name: about, label: Коротко о дисциплине, widget: text, required: false }
      - { name: image, label: Картинка папки, widget: image, required: false }
      - { name: order, label: Порядок на странице, hint: "Меньше число — выше папка: 10, 20, 30…", widget: number, value_type: int, default: 100 }
      - { name: id, label: Код для связи, hint: "Латиницей, например budget. После создания не меняйте: по нему материалы находят свою дисциплину.", widget: string, pattern: ['^[a-z0-9-]+$', 'Только строчные латинские буквы, цифры и дефис'] }

  - name: materials
    label: Материалы к занятиям
    label_singular: материал
    folder: content/materials
    format: json
    create: true
    # entries without a latin address get a date-and-time file name
    slug: &stamp "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: title
    summary: "{{title}} · {{kind}}"
    media_folder: /uploads/materials
    public_folder: /uploads/materials
    sortable_fields: [title, discipline, order]
    view_filters:
      - { label: Скрытые с сайта, field: published, pattern: false }
      - { label: Задания, field: kind, pattern: 'Задания' }
      - { label: Вопросы к экзамену, field: kind, pattern: 'Вопросы к экзамену' }
      - { label: Методические указания, field: kind, pattern: 'Методические указания' }
    view_groups:
      - { label: По дисциплинам, field: discipline }
      - { label: По виду, field: kind }
    fields:
      - { name: title, label: Название, widget: string }
      - name: discipline
        label: Дисциплина
        widget: relation
        collection: disciplines
        value_field: id
        search_fields: [name, code]
        display_fields: [name, code]
      - { name: kind, label: Вид, widget: select, options: [Задания, Вопросы к экзамену, Методические указания, Ссылка] }
      - { name: note, label: Пояснение, widget: string, required: false }
      - { name: file, label: Файл, hint: "PDF, DOCX или PPTX, до 20 МБ.", widget: file, required: false }
      - { name: link, label: Ссылка, hint: "Если материал на другом сайте.", widget: string, required: false }
      - { name: order, label: Порядок внутри дисциплины, hint: "Меньше число — выше: 10, 20, 30…", widget: number, value_type: int, default: 100 }
      - *published

  - name: success
    label: Успехи студентов
    label_singular: результат
    folder: content/success
    format: json
    create: true
    slug: *stamp
    identifier_field: event
    summary: "{{event}} · {{result}} · {{year}}"
    media_folder: /uploads/success
    public_folder: /uploads/success
    sortable_fields: [year, event, level]
    view_filters:
      - { label: Скрытые с сайта, field: published, pattern: false }
      - { label: Всероссийский уровень, field: level, pattern: 'Всероссийский' }
      - { label: Региональный уровень, field: level, pattern: 'Региональный' }
      - { label: Уровень колледжа, field: level, pattern: 'Колледж' }
    view_groups:
      - { label: По годам, field: year }
      - { label: По уровню, field: level }
    fields:
      - { name: event, label: Мероприятие, widget: string }
      - { name: result, label: Результат, hint: "Например: 1 место, 2 место, Лауреат, Диплом участника.", widget: string }
      - { name: level, label: Уровень, widget: select, options: [Всероссийский, Региональный, Колледж] }
      - { name: group, label: Кто, hint: "Без фамилий без согласия студентов: «Студенты группы ЭБУ-22».", widget: string, required: false }
      - { name: discipline, label: Код дисциплины, widget: string, required: false }
      - *year
      - { name: image, label: Фото, widget: image, required: false }
      - *published

  - name: about
    label: О преподавателе
    files:
      - name: category
        label: Квалификационная категория
        file: content/category.json
        format: json
        fields:
          - { name: title, label: Категория, hint: "Например: Высшая квалификационная категория. Первое слово попадает в печать.", widget: string }
          - { name: year, label: Год присвоения, widget: number, value_type: int, required: false }
          - { name: note, label: Пояснение, widget: text, required: false }

  - name: awards
    label: Грамоты и сертификаты
    label_singular: документ
    folder: content/awards
    format: json
    create: true
    slug: *stamp
    identifier_field: title
    summary: "{{title}} · {{kind}} · {{year}}"
    media_folder: /uploads/achievements
    public_folder: /uploads/achievements
    sortable_fields: [year, title, kind]
    view_filters:
      - { label: Скрытые с сайта, field: published, pattern: false }
      - { label: Грамоты, field: kind, pattern: 'Грамота' }
      - { label: Сертификаты и удостоверения, field: kind, pattern: 'Сертификат|Удостоверение' }
    view_groups:
      - { label: По годам, field: year }
      - { label: По виду, field: kind }
    fields:
      - { name: title, label: Название, widget: string }
      - { name: kind, label: Вид, widget: select, options: [Грамота, Благодарность, Диплом, Сертификат, Удостоверение] }
      - { name: issuer, label: Кем выдан, widget: string, required: false }
      - *year
      - { name: image, label: Скан или фото, widget: image, required: false }
      - { name: file, label: Файл (PDF), widget: file, required: false }
      - *published

  - name: news
    label: Новости
    label_singular: запись
    folder: content/news
    format: json
    create: true
    slug: *stamp
    identifier_field: title
    summary: "{{date}} · {{title}}"
    preview_path: "news/{{slug}}.html"
    media_folder: /uploads/news
    public_folder: /uploads/news
    sortable_fields: [date, title]
    view_filters:
      - { label: Скрытые с сайта, field: published, pattern: false }
    view_groups:
      - { label: По годам, field: date, pattern: '\d{4}' }
    fields:
      - { name: date, label: Дата, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: title, label: Заголовок, hint: "Коротко, до 60 знаков.", widget: string }
      - { name: text, label: Текст, hint: "Абзацы разделяйте пустой строкой. Первый абзац виден сразу.", widget: text }
      - { name: image, label: Фото, widget: image, required: false }
      - *published

  - name: crosswords
    label: Кроссворды
    label_singular: кроссворд
    description: "Кроссворды для раздела «Игры». Сетка собирается сама из слов и подсказок: лучше 8–15 слов с общими буквами."
    folder: content/crosswords
    format: json
    create: true
    slug: "{{fields.id}}"
    identifier_field: title
    summary: "{{title}}"
    preview_path: "games/{{fields.id}}.html"
    sortable_fields: [title]
    view_filters:
      - { label: Скрытые с сайта, field: published, pattern: false }
    fields:
      - { name: title, label: Тема кроссворда, hint: "Например: Основы бухгалтерского учёта. На сайте получится «Кроссворд · Основы бухгалтерского учёта».", widget: string }
      - name: discipline
        label: Дисциплина
        required: false
        widget: relation
        collection: disciplines
        value_field: id
        search_fields: [name, code]
        display_fields: [name, code]
      - { name: description, label: Описание, hint: "Одно-два предложения: о чём кроссворд и когда его разгадывать.", widget: text, required: false }
      - name: words
        label: Слова и подсказки
        label_singular: слово
        widget: list
        summary: "{{answer}} — {{clue}}"
        min: 2
        fields:
          - { name: answer, label: Слово, hint: "Одно слово, без пробелов. Ё и Е считаются одной буквой.", widget: string, pattern: ['^[А-Яа-яЁёA-Za-z]{2,}$', 'Только буквы, одно слово без пробелов'] }
          - { name: clue, label: Подсказка, widget: string }
      - { name: variant, label: Вариант сетки, hint: "Если сетка не понравилась или какое-то слово не встало, поставьте другое число (2, 3…) и опубликуйте снова.", widget: number, value_type: int, default: 1, min: 1 }
      - { name: id, label: Адрес страницы, hint: "Латиницей через дефис, например osnovy-ucheta. Получится адрес games/osnovy-ucheta.html.", widget: string, pattern: ['^[a-z0-9-]+$', 'Только строчные латинские буквы, цифры и дефис'] }
      - *published

  - name: quizzes
    label: Викторины
    label_singular: викторину
    description: "Викторины для раздела «Игры»: вопрос, варианты ответа А–Г, пояснение. Лучше 8–15 вопросов."
    folder: content/quizzes
    format: json
    create: true
    slug: "{{fields.id}}"
    identifier_field: title
    summary: "{{title}}"
    preview_path: "games/{{fields.id}}.html"
    sortable_fields: [title]
    view_filters:
      - { label: Скрытые с сайта, field: published, pattern: false }
    fields:
      - { name: title, label: Тема викторины, hint: "Например: Расчёты с персоналом. На сайте получится «Викторина · Расчёты с персоналом».", widget: string }
      - name: discipline
        label: Дисциплина
        required: false
        widget: relation
        collection: disciplines
        value_field: id
        search_fields: [name, code]
        display_fields: [name, code]
      - { name: description, label: Описание, hint: "Одно-два предложения: о чём викторина.", widget: text, required: false }
      - name: questions
        label: Вопросы
        label_singular: вопрос
        widget: list
        summary: "{{question}}"
        min: 1
        fields:
          - { name: question, label: Вопрос, widget: text }
          - name: options
            label: Варианты ответа
            label_singular: вариант
            hint: "2–6 вариантов. Отметьте верный; если отметить несколько, студент выбирает все верные и нажимает «Ответить»."
            widget: list
            summary: "{{text}}"
            min: 2
            max: 6
            fields:
              - { name: text, label: Ответ, widget: string }
              - { name: correct, label: Верный, widget: boolean, default: false }
          - { name: explain, label: Пояснение, hint: "Показывается после ответа: почему верно именно так.", widget: text, required: false }
          - { name: image, label: Картинка к вопросу, hint: "Например, фрагмент документа. Можно оставить пустым.", widget: image, required: false, media_folder: /uploads/games, public_folder: /uploads/games }
      - { name: shuffle, label: Перемешивать вопросы и ответы, widget: boolean, default: true }
      - { name: id, label: Адрес страницы, hint: "Латиницей через дефис, например raschety-s-personalom. Не должен совпадать с адресом кроссворда.", widget: string, pattern: ['^[a-z0-9-]+$', 'Только строчные латинские буквы, цифры и дефис'] }
      - *published

  - name: matches
    label: Найди пару
    label_singular: игру «Найди пару»
    description: "Термины слева, определения справа: студент соединяет их нитью. Лучше 5–10 пар."
    folder: content/matches
    format: json
    create: true
    slug: "{{fields.id}}"
    identifier_field: title
    summary: "{{title}}"
    preview_path: "games/{{fields.id}}.html"
    sortable_fields: [title]
    view_filters:
      - { label: Скрытые с сайта, field: published, pattern: false }
    fields:
      - { name: title, label: Тема, hint: "Например: Термины бухгалтерского учёта. На сайте получится «Найди пару · Термины бухгалтерского учёта».", widget: string }
      - name: discipline
        label: Дисциплина
        required: false
        widget: relation
        collection: disciplines
        value_field: id
        search_fields: [name, code]
        display_fields: [name, code]
      - { name: description, label: Описание, hint: "Одно-два предложения: что соединяем и зачем.", widget: text, required: false }
      - name: pairs
        label: Пары
        label_singular: пару
        hint: "Слева короткое: термин, номер счёта, название коэффициента. Справа его определение или формула."
        widget: list
        summary: "{{term}} — {{definition}}"
        min: 2
        max: 12
        fields:
          - { name: term, label: Термин, widget: string }
          - { name: definition, label: Определение, widget: string }
      - { name: id, label: Адрес страницы, hint: "Латиницей через дефис, например terminy-ucheta. Не должен совпадать с адресом другой игры.", widget: string, pattern: ['^[a-z0-9-]+$', 'Только строчные латинские буквы, цифры и дефис'] }
      - *published

  - name: orders
    label: Расставь по порядку
    label_singular: игру «Расставь по порядку»
    description: "Шаги процедуры, которые студент расставляет по порядку. Введите шаги в правильной последовательности — игра перемешает их сама. Лучше 4–10 шагов."
    folder: content/orders
    format: json
    create: true
    slug: "{{fields.id}}"
    identifier_field: title
    summary: "{{title}}"
    preview_path: "games/{{fields.id}}.html"
    sortable_fields: [title]
    view_filters:
      - { label: Скрытые с сайта, field: published, pattern: false }
    fields:
      - { name: title, label: Тема, hint: "Например: Этапы инвентаризации.", widget: string }
      - name: discipline
        label: Дисциплина
        required: false
        widget: relation
        collection: disciplines
        value_field: id
        search_fields: [name, code]
        display_fields: [name, code]
      - { name: description, label: Описание, widget: text, required: false }
      - { name: task, label: Задание, hint: "Например: Расположите этапы инвентаризации в правильной последовательности.", widget: string, required: false }
      - name: steps
        label: Шаги в правильном порядке
        label_singular: шаг
        hint: "Первый в списке — первый шаг. Порядок шагов можно менять перетаскиванием."
        widget: list
        summary: "{{text}}"
        min: 3
        max: 12
        fields:
          - { name: text, label: Шаг, widget: string }
      - { name: explain, label: Пояснение, hint: "Показывается, когда порядок собран верно: почему именно так.", widget: text, required: false }
      - { name: id, label: Адрес страницы, hint: "Латиницей через дефис, например etapy-inventarizacii. Не должен совпадать с адресом другой игры.", widget: string, pattern: ['^[a-z0-9-]+$', 'Только строчные латинские буквы, цифры и дефис'] }
      - *published

  - name: sorts
    label: Разложи по корзинам
    label_singular: игру «Разложи по корзинам»
    description: "Корзины-категории и карточки, которые студент раскладывает по ним. Для каждой корзины введите карточки, которые в неё относятся, — игра перемешает их сама. Лучше 2–4 корзины и 8–16 карточек."
    folder: content/sorts
    format: json
    create: true
    slug: "{{fields.id}}"
    identifier_field: title
    summary: "{{title}}"
    preview_path: "games/{{fields.id}}.html"
    sortable_fields: [title]
    view_filters:
      - { label: Скрытые с сайта, field: published, pattern: false }
    fields:
      - { name: title, label: Тема, hint: "Например: Активные и пассивные счета.", widget: string }
      - name: discipline
        label: Дисциплина
        required: false
        widget: relation
        collection: disciplines
        value_field: id
        search_fields: [name, code]
        display_fields: [name, code]
      - { name: description, label: Описание, widget: text, required: false }
      - { name: task, label: Задание, hint: "Например: Разложите счета по корзинам.", widget: string, required: false }
      - name: bins
        label: Корзины
        label_singular: корзину
        hint: "От 2 до 4 корзин. В каждой — карточки, которые должны в неё попасть."
        widget: list
        summary: "{{name}}"
        min: 2
        max: 4
        fields:
          - { name: name, label: Название корзины, hint: "Например: Активные.", widget: string }
          - name: items
            label: Карточки этой корзины
            label_singular: карточку
            widget: list
            summary: "{{text}}"
            min: 1
            max: 10
            fields:
              - { name: text, label: Карточка, widget: string }
      - { name: explain, label: Пояснение, hint: "Показывается, когда всё разложено верно: на что обратить внимание.", widget: text, required: false }
      - { name: id, label: Адрес страницы, hint: "Латиницей через дефис, например klassifikaciya-schetov. Не должен совпадать с адресом другой игры.", widget: string, pattern: ['^[a-z0-9-]+$', 'Только строчные латинские буквы, цифры и дефис'] }
      - *published

  - name: tests
    label: Тесты по дисциплинам
    label_singular: тест
    description: "Тест с оценкой: студент отвечает на вопросы по одному, с таймером, в конце видит оценку, разбор ошибок и бланк результата. Можно завести банк вопросов побольше — каждому студенту достанется свой набор."
    folder: content/tests
    format: json
    create: true
    slug: "{{fields.id}}"
    identifier_field: title
    summary: "{{title}}"
    preview_path: "tests/{{fields.id}}.html"
    sortable_fields: [title, discipline]
    view_filters:
      - { label: Скрытые с сайта, field: published, pattern: false }
    view_groups:
      - { label: Дисциплина, field: discipline }
    fields:
      - { name: title, label: Тема теста, hint: "Например: НДФЛ и страховые взносы.", widget: string }
      - name: discipline
        label: Дисциплина
        widget: relation
        collection: disciplines
        value_field: id
        search_fields: [name, code]
        display_fields: [name, code]
      - { name: description, label: Описание, hint: "Одно-два предложения: что проверяет тест.", widget: text, required: false }
      - { name: minutes, label: "Время на тест, минут", hint: "0 — без ограничения времени.", widget: number, value_type: int, min: 0, max: 180, default: 20 }
      - { name: count, label: Сколько вопросов давать, hint: "Если вопросов в банке больше, каждому студенту достанется случайный набор такого размера. Пусто — все вопросы.", widget: number, value_type: int, min: 1, required: false }
      - { name: five, label: "Оценка «5» — от, %", widget: number, value_type: int, min: 1, max: 100, default: 90 }
      - { name: four, label: "Оценка «4» — от, %", widget: number, value_type: int, min: 1, max: 100, default: 75 }
      - { name: three, label: "Оценка «3» — от, %", hint: "Меньше — «2».", widget: number, value_type: int, min: 1, max: 100, default: 60 }
      - name: questions
        label: Вопросы
        label_singular: вопрос
        summary: "{{question}}"
        widget: list
        min: 2
        fields:
          - name: type
            label: Тип вопроса
            widget: select
            default: one
            options:
              - { label: Один верный ответ, value: one }
              - { label: Несколько верных ответов, value: many }
              - { label: Ввести ответ с клавиатуры, value: text }
          - { name: question, label: Вопрос, widget: text }
          - name: options
            label: Варианты ответа
            label_singular: вариант
            hint: "Для вопросов с выбором. Отметьте верные — тест перемешает варианты сам."
            widget: list
            required: false
            summary: "{{text}}"
            fields:
              - { name: text, label: Вариант, widget: string }
              - { name: correct, label: Верный, widget: boolean, default: false }
          - { name: answer, label: Верный ответ для ввода, hint: "Для вопросов с вводом. Несколько допустимых ответов — через точку с запятой: 13; 13%. Регистр, пробелы и буква ё не важны.", widget: string, required: false }
          - { name: explain, label: Пояснение, hint: "Показывается в разборе после теста.", widget: text, required: false }
      - { name: id, label: Адрес страницы, hint: "Латиницей через дефис, например ndfl-i-vznosy.", widget: string, pattern: ['^[a-z0-9-]+$', 'Только строчные латинские буквы, цифры и дефис'] }
      - *published
