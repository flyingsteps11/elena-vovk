<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Редактор сайта — Е. А. Вовк</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<!-- Sign-in with e-mail and password (Netlify Identity); also accepts the invitation and password-reset links -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<!-- Decap CMS reads admin/config.yml next to this page.
     Pinned with a hash: to update, change the version and recompute integrity
     (openssl dgst -sha384 -binary decap-cms.js | openssl base64 -A). -->
<script src="https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js" integrity="sha384-d2pbrhjc5asvSK35gKkrgRIk0Wq+2CQynWnXtSsYWQawXCgBXhcAK737jBAKXT4T" crossorigin="anonymous"></script>
<script>
  // the preview pane next to the form uses the site's own fonts and colours
  CMS.registerPreviewStyle(new URL('../css/base.css', location.href).href);
  CMS.registerPreviewStyle(`body{padding:24px;background:var(--bg);color:var(--ink)}
    .pv{background:var(--paper);padding:28px 30px 32px;max-width:720px}
    .pv h1{font-size:2.25rem;line-height:1.05;margin:0 0 12px}
    .pv__meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);margin:0 0 18px}
    .pv__code{background:var(--ink);color:var(--accent-ink);padding:2px 9px;font-size:.875rem}
    .pv__date{font-size:3.5rem;line-height:.9;font-weight:500}
    .pv img{display:block;width:100%;height:auto;margin:18px 0}
    .pv__plate{display:flex;justify-content:space-between;align-items:flex-end;aspect-ratio:4/3;background:var(--tone-3);padding:22px;margin:18px 0;font-size:1.5rem}
    .pv__file{border-top:2px dotted var(--muted);margin-top:20px;padding-top:14px}
    .pv__hidden{background:var(--ink);color:var(--accent-ink);display:inline-block;padding:4px 10px;margin-bottom:14px}`, { raw: true });

  // «Справка» in the bottom left corner opens the editor's guide (admin/help.html) in a new tab;
  // Decap has no place for own links in its top bar, so the button lives outside it
  const help = document.createElement('a');
  help.href = 'help.html'; help.target = '_blank'; help.rel = 'noopener'; help.textContent = '? Справка';
  help.style.cssText = 'position:fixed;left:16px;bottom:16px;z-index:1000;padding:9px 16px;border-radius:20px;background:#351a2b;color:#edccbe;font:600 14px/1.2 system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.2)';
  document.body.appendChild(help);

  // works and news are previewed as they look on the site
  const h = window.h;
  const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const val = (entry, key) => entry.getIn(['data', key]);
  const pic = (props, key) => { const v = val(props.entry, key); return v ? String(props.getAsset(v) || v) : ''; };
  const hidden = (entry) => (val(entry, 'published') === false ? h('p', { className: 'pv__hidden' }, 'Скрыто с сайта') : null);

  CMS.registerPreviewTemplate('works', (props) => {
    const e = props.entry, cover = pic(props, 'cover'), file = val(e, 'file');
    return h('article', { className: 'pv' },
      hidden(e),
      h('h1', null, val(e, 'title') || 'Название работы'),
      h('p', { className: 'pv__meta' }, [val(e, 'type'), val(e, 'year')].filter(Boolean).join(', '),
        val(e, 'discipline') ? h('span', { className: 'pv__code' }, val(e, 'discipline')) : null),
      val(e, 'description') ? h('p', null, val(e, 'description')) : null,
      cover ? h('img', { src: cover, alt: '' })
        : h('div', { className: 'pv__plate' }, h('span', null, val(e, 'type') || 'Работа'), h('span', null, val(e, 'year') || '')),
      h('p', { className: 'pv__file' }, file ? 'Файл: ' + String(file).split('/').pop() : 'Файл этой работы пока не выложен.'));
  });

  CMS.registerPreviewTemplate('news', (props) => {
    const e = props.entry, img = pic(props, 'image');
    const [y, m, d] = String(val(e, 'date') || '').split('-');
    return h('article', { className: 'pv' },
      hidden(e),
      d ? h('p', { className: 'pv__meta' }, h('span', { className: 'pv__date' }, Number(d)), months[Number(m) - 1] + ' ' + y) : null,
      h('h1', null, val(e, 'title') || 'Заголовок записи'),
      ...String(val(e, 'text') || '').split(/\n\s*\n/).filter(Boolean).map((t, i) => h('p', { key: i }, t)),
      img ? h('img', { src: img, alt: '' }) : null);
  });
</script>
</body>
</html>
